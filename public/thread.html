<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YuiAnon — hilo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #15121f;
    --bg-soft: #1c1830;
    --card: #211c37;
    --line: #332c52;
    --ink: #efeaf7;
    --ink-dim: #9c93bd;
    --glow: #8b7cf6;
    --glow-soft: rgba(139,124,246,0.18);
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(700px 400px at 50% -10%, var(--glow-soft), transparent 60%),
      var(--bg);
    color: var(--ink);
    font-family: 'Sora', sans-serif;
    padding: 24px 16px 60px;
  }
  .wrap{ max-width: 560px; margin: 0 auto; }
  .mark{ text-align:center; margin-bottom: 28px; }
  .mark .word{ font-family:'Fraunces', serif; font-size: 1.6rem; font-weight:600; }
  .mark .word span{ color: var(--glow); }

  .msg{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px 18px;
    margin-bottom: 12px;
  }
  .msg.first{
    border-color: var(--glow);
    box-shadow: 0 0 0 1px var(--glow-soft);
  }
  .msg .texto{
    font-size: 1rem;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg .meta{
    margin-top: 8px;
    font-size: 0.74rem;
    color: var(--ink-dim);
  }

  .reply{
    margin-top: 24px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
  }
  textarea{
    width:100%;
    min-height: 90px;
    resize: vertical;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--ink);
    font-family: 'Sora', sans-serif;
    font-size: 1rem;
    padding: 12px;
    outline: none;
  }
  textarea:focus{ border-color: var(--glow); }
  textarea::placeholder{ color: #6a6291; }
  .row{ display:flex; justify-content:flex-end; margin-top: 10px; }
  button{
    background: var(--glow);
    color: #15122a;
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    font-family: 'Sora', sans-serif;
    font-weight: 600;
    font-size: 0.92rem;
    cursor: pointer;
  }
  button:hover{ filter: brightness(1.08); }
  button:disabled{ opacity: 0.5; cursor: default; }

  .empty, .error{ text-align:center; color: var(--ink-dim); padding: 40px 0; }

  .actions{
    display:flex;
    gap: 8px;
    justify-content:center;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .btnSec{
    background: var(--bg-soft);
    color: var(--ink-dim);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 14px;
    font-family: 'Sora', sans-serif;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .btnSec:hover{ color: var(--ink); border-color: var(--glow); }
  .btnSec.active{ color: var(--glow); border-color: var(--glow); }
  .btnSec.danger:hover{ color: #e78a8a; border-color: #e78a8a; }

  .foot{ text-align:center; margin-top: 30px; }
  .foot a{ color: var(--glow); text-decoration:none; font-size: 0.85rem; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark"><div class="word">Yui<span>Anon</span></div></div>

    <div class="actions" id="actions" style="display:none">
      <button id="avisar" class="btnSec">🔔 Avisarme de nuevas respuestas</button>
      <button id="borrar" class="btnSec danger">Eliminar hilo</button>
    </div>

    <div id="hilo"><div class="empty">Cargando…</div></div>

    <div class="reply" id="replyBox" style="display:none">
      <textarea id="respuesta" maxlength="500" placeholder="Responde de forma anónima..."></textarea>
      <div class="row">
        <button id="enviar">Responder</button>
      </div>
    </div>

    <div class="foot"><a href="/">Crear tu propio hilo →</a></div>
  </div>

<script>
  const id = location.pathname.split('/').pop();
  const hiloEl = document.getElementById('hilo');
  const replyBox = document.getElementById('replyBox');
  const respuesta = document.getElementById('respuesta');
  const enviarBtn = document.getElementById('enviar');
  const actions = document.getElementById('actions');
  const avisarBtn = document.getElementById('avisar');
  const borrarBtn = document.getElementById('borrar');

  let ultimoConteo = null;
  let avisosActivos = false;
  let intervaloAviso = null;

  function fecha(ts){
    return new Date(ts).toLocaleString();
  }

  function render(hilo){
    hiloEl.innerHTML = '';
    hilo.mensajes.forEach((m, i) => {
      const div = document.createElement('div');
      div.className = 'msg' + (i === 0 ? ' first' : '');
      div.innerHTML = `<div class="texto"></div><div class="meta">${i === 0 ? 'mensaje original' : 'respuesta anónima'} · ${fecha(m.fecha)}</div>`;
      div.querySelector('.texto').textContent = m.texto;
      hiloEl.appendChild(div);
    });
    replyBox.style.display = 'block';
    actions.style.display = 'flex';
    ultimoConteo = hilo.mensajes.length;
  }

  async function cargar(silencioso){
    try {
      const res = await fetch(`/api/hilos/${id}`);
      if (!res.ok) {
        if (!silencioso) hiloEl.innerHTML = '<div class="error">Este hilo no existe o fue eliminado.</div>';
        return;
      }
      const hilo = await res.json();

      if (avisosActivos && ultimoConteo !== null && hilo.mensajes.length > ultimoConteo) {
        const nuevas = hilo.mensajes.length - ultimoConteo;
        if (Notification.permission === 'granted') {
          new Notification('YuiAnon', { body: `Tienes ${nuevas} respuesta(s) nueva(s)` });
        }
      }
      render(hilo);
    } catch (e) {
      if (!silencioso) hiloEl.innerHTML = '<div class="error">No se pudo cargar el hilo.</div>';
    }
  }

  avisarBtn.addEventListener('click', async () => {
    if (avisosActivos) {
      avisosActivos = false;
      clearInterval(intervaloAviso);
      avisarBtn.textContent = '🔔 Avisarme de nuevas respuestas';
      avisarBtn.classList.remove('active');
      return;
    }
    if (!('Notification' in window)) {
      alert('Tu navegador no soporta notificaciones.');
      return;
    }
    const permiso = await Notification.requestPermission();
    if (permiso !== 'granted') {
      alert('No diste permiso para notificaciones.');
      return;
    }
    avisosActivos = true;
    avisarBtn.textContent = '🔔 Avisos activados';
    avisarBtn.classList.add('active');
    intervaloAviso = setInterval(() => cargar(true), 8000);
  });

  borrarBtn.addEventListener('click', async () => {
    const clave = prompt('Escribe la clave de borrado que se te dio al crear este hilo:');
    if (!clave) return;
    try {
      const res = await fetch(`/api/hilos/${id}`, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ clave })
      });
      const data = await res.json();
      if (!res.ok) {
        alert(data.error || 'No se pudo eliminar el hilo.');
        return;
      }
      alert('Hilo eliminado.');
      location.href = '/';
    } catch (e) {
      alert('No se pudo eliminar el hilo.');
    }
  });

  enviarBtn.addEventListener('click', async () => {
    const mensaje = respuesta.value.trim();
    if (!mensaje) return;
    enviarBtn.disabled = true;
    enviarBtn.textContent = 'Enviando...';
    try {
      const res = await fetch(`/api/hilos/${id}/responder`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mensaje })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '');
      respuesta.value = '';
      if (typeof data.total === 'number') ultimoConteo = data.total; // evita autonotificarse
      await cargar(true);
    } catch (e) {
      alert(e.message || 'No se pudo enviar la respuesta.');
    } finally {
      enviarBtn.disabled = false;
      enviarBtn.textContent = 'Responder';
    }
  });

  cargar();
</script>
</body>
</html>
