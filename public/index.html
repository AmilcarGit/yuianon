<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YuiAnon — deja un mensaje, sin nombre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #15121f;
    --bg-soft: #1c1830;
    --card: #211c37;
    --line: #332c52;
    --ink: #efeaf7;
    --ink-dim: #9c93bd;
    --glow: #8b7cf6;
    --glow-soft: rgba(139,124,246,0.18);
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:
      radial-gradient(700px 400px at 50% -10%, var(--glow-soft), transparent 60%),
      var(--bg);
    color: var(--ink);
    font-family: 'Sora', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
  }
  .wrap{
    width:100%;
    max-width: 480px;
  }
  .mark{
    text-align:center;
    margin-bottom: 36px;
  }
  .mark .word{
    font-family: 'Fraunces', serif;
    font-size: 2.1rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .mark .word span{ color: var(--glow); }
  .mark .tag{
    margin-top: 6px;
    color: var(--ink-dim);
    font-size: 0.92rem;
  }
  .card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 22px;
  }
  textarea{
    width:100%;
    min-height: 110px;
    resize: vertical;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--ink);
    font-family: 'Sora', sans-serif;
    font-size: 1rem;
    padding: 14px;
    outline: none;
  }
  textarea:focus{ border-color: var(--glow); }
  textarea::placeholder{ color: #6a6291; }
  .row{
    display:flex;
    justify-content: space-between;
    align-items:center;
    margin-top: 12px;
  }
  .count{ color: var(--ink-dim); font-size: 0.8rem; }
  button{
    background: var(--glow);
    color: #15122a;
    border: none;
    border-radius: 10px;
    padding: 11px 20px;
    font-family: 'Sora', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: filter 0.15s ease;
  }
  button:hover{ filter: brightness(1.08); }
  button:disabled{ opacity: 0.5; cursor: default; }

  .result{
    display:none;
    margin-top: 18px;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
  }
  .result.show{ display:block; }
  .result p{
    margin:0 0 10px 0;
    color: var(--ink-dim);
    font-size: 0.88rem;
  }
  .linkrow{
    display:flex;
    gap: 8px;
  }
  .linkrow input{
    flex:1;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--ink);
    padding: 10px 12px;
    font-family: 'Sora', sans-serif;
    font-size: 0.85rem;
  }
  .linkrow button{
    padding: 10px 16px;
    font-size: 0.85rem;
  }
  .goto{
    display:inline-block;
    margin-top: 12px;
    color: var(--glow);
    text-decoration: none;
    font-size: 0.88rem;
    border-bottom: 1px solid transparent;
  }
  .goto:hover{ border-bottom-color: var(--glow); }
  .foot{
    text-align:center;
    margin-top: 24px;
    color: var(--ink-dim);
    font-size: 0.78rem;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">
      <div class="word">Yui<span>Anon</span></div>
      <div class="tag">escribe algo. nadie sabrá que fuiste tú.</div>
    </div>

    <div class="card">
      <textarea id="mensaje" maxlength="500" placeholder="Holi..."></textarea>
      <div class="row">
        <span class="count"><span id="n">0</span>/500</span>
        <button id="crear">Crear enlace</button>
      </div>

      <div class="result" id="result">
        <p>Listo. Comparte este enlace — cualquiera puede responder sin registrarse:</p>
        <div class="linkrow">
          <input id="link" readonly>
          <button id="copiar">Copiar</button>
        </div>
        <p style="margin-top:14px;color:#c9853f;">Guarda esta clave — es la única forma de borrar el hilo después:</p>
        <div class="linkrow">
          <input id="clave" readonly>
          <button id="copiarClave">Copiar</button>
        </div>
        <a class="goto" id="ver" href="#">Ver el hilo →</a>
      </div>
    </div>

    <div class="foot">sin cuentas · sin rastros · gratis</div>
  </div>

<script>
  const ta = document.getElementById('mensaje');
  const n = document.getElementById('n');
  const btn = document.getElementById('crear');
  const result = document.getElementById('result');
  const linkInput = document.getElementById('link');
  const copiarBtn = document.getElementById('copiar');
  const verLink = document.getElementById('ver');
  const claveInput = document.getElementById('clave');
  const copiarClaveBtn = document.getElementById('copiarClave');

  ta.addEventListener('input', () => { n.textContent = ta.value.length; });

  btn.addEventListener('click', async () => {
    const mensaje = ta.value.trim();
    if (!mensaje) return;
    btn.disabled = true;
    btn.textContent = 'Creando...';
    try {
      const res = await fetch('/api/hilos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mensaje })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Error');

      const url = `${location.origin}/hilo/${data.id}`;
      linkInput.value = url;
      verLink.href = url;
      claveInput.value = data.clave;
      result.classList.add('show');
    } catch (e) {
      alert(e.message || 'No se pudo crear el hilo. Intenta de nuevo.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Crear enlace';
    }
  });

  copiarBtn.addEventListener('click', () => {
    linkInput.select();
    navigator.clipboard.writeText(linkInput.value).then(() => {
      copiarBtn.textContent = 'Copiado';
      setTimeout(() => { copiarBtn.textContent = 'Copiar'; }, 1500);
    });
  });

  copiarClaveBtn.addEventListener('click', () => {
    claveInput.select();
    navigator.clipboard.writeText(claveInput.value).then(() => {
      copiarClaveBtn.textContent = 'Copiado';
      setTimeout(() => { copiarClaveBtn.textContent = 'Copiar'; }, 1500);
    });
  });
</script>
</body>
</html>
